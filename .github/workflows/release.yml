name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: mkdir -p .artifacts && pnpm pack --pack-destination .artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: .artifacts/*.tgz
          generate_release_notes: true
